<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MeMedia channel player</title>
<style>html,body{margin:0;height:100%;background:#080a11;color:#eef5f4;font:12px system-ui}body{display:flex;flex-direction:column}#stage{flex:1;min-height:170px}#stage iframe{width:100%;height:100%;border:0}nav{display:flex;align-items:center;gap:8px;min-height:44px;padding:5px 8px}button{border:1px solid #343748;border-radius:12px;background:#151825;color:#c4f4e1;padding:5px 9px;cursor:pointer}button:disabled{opacity:.35;cursor:default}#status{flex:1;white-space:normal;overflow-wrap:anywhere;color:#a9b4be;font-size:10px;line-height:1.4}</style>
<div id="stage"></div><nav><button id="previous" aria-label="Previous media">‹</button><span id="status">Loading channel</span><button id="sound">Mute</button><button id="next" aria-label="Next media">Next ›</button></nav>
<script type="module" src="channel-player.js"></script></html>
