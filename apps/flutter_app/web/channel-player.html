<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MeMedia channel player</title>
<style>html,body{margin:0;height:100%;background:#080a11;color:#eef5f4;font:12px system-ui}body{display:flex;flex-direction:column}#stage{flex:1;min-height:200px}#stage iframe{width:100%;height:100%;border:0}nav{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px}button{border:1px solid #343748;border-radius:12px;background:#151825;color:#c4f4e1;padding:3px 9px;cursor:pointer}#status{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#a9b4be;font-size:10px}</style>
<div id="stage"></div><nav><button id="previous" aria-label="Previous media">‹</button><span id="status">Loading channel…</span><button id="sound">Unmute</button><button id="next" aria-label="Next media">Next ›</button></nav>
<script>
let queue=[];try{queue=JSON.parse(decodeURIComponent(location.hash.slice(1))).filter(a=>a&&((a.platform==='YouTube'&&/^yt-[\w-]{11}$/.test(a.id))||(a.platform==='TikTok'&&/^tt-\d+$/.test(a.id))));}catch{}
history.replaceState(null,'',location.pathname);
let index=0,player=null,frame=null,muted=true,ytReady=false,generation=0;
const stage=document.getElementById('stage'),status=document.getElementById('status');
function label(s){status.textContent=s||`${index+1}/${queue.length} · ${queue[index]?.title||'No playable media'}`;}
function tiktok(type,value){frame?.contentWindow?.postMessage({'x-tiktok-player':true,type,value},'https://www.tiktok.com');}
function show(){generation++;try{player?.destroy();}catch{}player=null;frame=null;stage.replaceChildren();label();const a=queue[index];if(!a)return;
 if(a.platform==='YouTube'){
  if(!ytReady){label('Loading YouTube…');return;}const div=document.createElement('div');stage.append(div);const gen=generation;
  label('Loading YouTube…');player=new YT.Player(div,{host:'https://www.youtube.com',videoId:a.id.slice(3),width:'100%',height:'100%',playerVars:{autoplay:1,playsinline:1,origin:location.origin,rel:0},events:{onReady(e){if(gen!==generation)return;e.target.mute();muted=true;document.getElementById('sound').textContent='Unmute';e.target.playVideo();label();},onStateChange(e){if(gen===generation&&e.data===0)next();},onAutoplayBlocked(){label('Tap the player to start');},onError(){label('Embedding unavailable · try Next or source details');}}});
 }else{frame=document.createElement('iframe');frame.src=`https://www.tiktok.com/player/v1/${a.id.slice(3)}?autoplay=1&muted=1&controls=1&description=0&music_info=0`;frame.title=a.title;frame.allow='autoplay; fullscreen; encrypted-media';stage.append(frame);muted=true;document.getElementById('sound').textContent='Unmute';}
}
function next(){if(index+1<queue.length){index++;show();}else label('End of channel · choose another media card');}
document.getElementById('next').onclick=next;document.getElementById('previous').onclick=()=>{if(index>0){index--;show();}};
document.getElementById('sound').onclick=()=>{muted=!muted;if(player){muted?player.mute():player.unMute();player.playVideo();}else{if(!muted&&frame?.src.includes('muted=1'))frame.src=frame.src.replace('muted=1','muted=0');else{tiktok(muted?'mute':'unMute');tiktok('play');}}document.getElementById('sound').textContent=muted?'Unmute':'Mute';};
window.addEventListener('message',e=>{if(e.origin!=='https://www.tiktok.com'||e.source!==frame?.contentWindow||!e.data?.['x-tiktok-player'])return;if(e.data.type==='onStateChange'&&e.data.value===0)next();if(e.data.type==='onPlayerReady')label();if(e.data.type==='onPlayerError')label('TikTok playback unavailable · try Next or source details');});
window.onYouTubeIframeAPIReady=()=>{ytReady=true;if(queue[index]?.platform==='YouTube')show();};
const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';document.head.append(script);show();
</script></html>
